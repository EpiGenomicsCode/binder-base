# BinderBase production nginx.
#
# Paths follow the layout in misc/deploy/DEPLOY.md:
#
#   /opt/binder/binder-base/                        the checkout
#   /opt/binder/binder-base/binder_frontend/dist/   the React build, served directly
#   /opt/binder/binder-base/binder_backend/static/  STATIC_ROOT (Django admin)
#   /opt/binder/files/                              MEDIA_ROOT
#
# A live server that terminates TLS has a second server block, usually written
# by certbot, and replacing this file wholesale would drop it. To add
# compression and caching to a server already running, merge the directives
# rather than overwriting -- DEPLOY.md, "Compression and caching", lists
# exactly which ones and how to check they took.

server {
    listen 80;
    server_name _;

    root /opt/binder/binder-base/binder_frontend/dist;
    index index.html;

    # ---- Compression --------------------------------------------------------
    #
    # Measured against the live site on 2026-11-01, which was serving every
    # byte uncompressed:
    #
    #   molstar.js      4,748 KB -> 1,348 KB
    #   index.js          178 KB ->    58 KB
    #   index.css         112 KB ->    17 KB
    #   a PAE matrix      321 KB ->    35 KB   (9.2x)
    #   /api/proteins     179 KB ->    48 KB
    #   /api/runs          79 KB ->    10 KB   (7.8x)
    #   a binder CIF      121 KB ->    38 KB   (3.2x)
    #
    # A first visit to a run page pulled 5.0 MB of JS and CSS where 1.4 MB
    # would do. Django runs no GZipMiddleware, so nginx is the only thing that
    # can compress the API.
    #
    # text/html is always compressed when gzip is on and must not be listed in
    # gzip_types; naming it there is a no-op at best and a duplicate at worst.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;   # without this, proxied /api/ responses stay raw
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        application/javascript
        text/javascript
        text/css
        application/json
        application/xml
        image/svg+xml
        text/plain;

    # ---- The SPA shell ------------------------------------------------------
    #
    # index.html names the content-hashed asset files, so holding a stale copy
    # past a deploy is what produces the missing-chunk failure below. It is the
    # one file that must always be revalidated. Everything it points at is
    # immutable and cached for a year.
    #
    # try_files' last argument is a URI, so the fallback is an internal
    # redirect and location matching runs again -- which is why an unknown path
    # like /runs/12 also lands here and also gets no-cache.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }

    # ---- Hashed build assets ------------------------------------------------
    #
    # `=404` instead of falling through to the SPA. Without it, a browser still
    # holding an index.html from before a deploy requests a chunk that no
    # longer exists and is handed index.html back with `200 text/html`, so a
    # missing file surfaces as a JavaScript syntax error with nothing in the
    # network tab to explain it. Verified against the live site: a request for
    # /assets/index-DOESNOTEXIST.js returned 200 and 2,204 bytes of HTML.
    #
    # The filenames carry a content hash, so a given URL can never change
    # contents and `immutable` is safe -- it also stops the revalidation
    # round-trip that `no-cache` would force on every repeat visit.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- Structures ---------------------------------------------------------
    #
    # .cif is absent from nginx's mime.types, so these were served as
    # application/octet-stream and skipped by gzip. They are plain text and
    # compress 3.2x. Naming the type costs the viewer nothing: CifViewer passes
    # Mol* the "mmcif" format explicitly, by URL and by string, so it never
    # consults Content-Type.
    #
    # A regex location wins over the /media/ prefix below regardless of the
    # order they appear in, and the capture is what `alias` interpolates.
    location ~* ^/media/(.+\.cif)$ {
        alias /opt/binder/files/$1;
        default_type chemical/x-cif;
        gzip_types chemical/x-cif;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Run outputs and AlphaFold downloads: written once by the importer and
    # never edited in place, so a month is conservative.
    location /media/ {
        alias /opt/binder/files/;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ---- Django -------------------------------------------------------------

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin's own CSS and JS (collectstatic output).
    location /static/ {
        alias /opt/binder/binder-base/binder_backend/static/;
        add_header Cache-Control "public, max-age=2592000";
    }
}
